[project]
name = "canvas-autograder-backend"
version = "0.1.0"
description = "Canvas Autograder backend (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.123",
    "fastapi>=0.146.0",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=6.21.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
