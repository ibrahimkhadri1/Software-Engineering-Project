services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: autograder
      POSTGRES_PASSWORD: autograder
      POSTGRES_DB: autograder
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autograder"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
